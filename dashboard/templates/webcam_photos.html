{% extends "base.html" %}
{% block title %}Webcam Photos – Workstation Monitor{% endblock %}
{% block content %}
<h2>Webcam Photos</h2>
{% if items %}
<div class="row g-3">
  {% for item in items %}
  <div class="col-md-4">
    <div class="card">
      <img src="{{ url_for('view_image', path=item.path) }}"
           class="card-img-top"
           alt="{{ item.name }}"
           loading="lazy"
           style="max-height:200px;object-fit:contain;background:#000;">
      <div class="card-body">
        <p class="card-text small text-muted">{{ item.modified }}</p>
        <a class="btn btn-sm btn-outline-primary"
           href="{{ url_for('download', path=item.path) }}">Download {{ item.name }}</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% else %}
<p class="text-muted">No webcam photos found.</p>
{% endif %}
{% endblock %}
